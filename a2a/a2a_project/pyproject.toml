[project]
name = "a2a-sales-intelligence-pipeline"
version = "0.1.0"
description = "A2A Sales Intelligence Pipeline using LangChain, CrewAI, AutoGen, and A2A SDK with Streamlit UI"
authors = [
    { name = "Aman Husain", email = "amanhusain8899@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk>=0.3.11",
    "autogen-agentchat>=0.7.5",
    "crewai>=0.28.0",
    "fastapi>=0.115.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "plotly>=5.20.0",
    "python-dotenv>=1.0.1",
    "pyautogen>=0.2.0",
    "sse-starlette>=2.1.0",
    "streamlit>=1.30.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
